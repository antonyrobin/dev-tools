<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0e" />
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong colours -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var pref = localStorage.getItem('devtools:theme') || 'system';
          theme = pref === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : pref;
        } catch (e) { /* storage blocked */ }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="DevTools Open Source" />

    <!-- Per-page title, description, keywords, canonical, social tags and structured data: see vite-plugin-seo.js -->
    <!--app-seo-->
    <style>
      .seo-fallback { max-width: 960px; margin: 0 auto; padding: 5rem 1rem 2rem; font: 14px/1.5 system-ui, sans-serif; color: #8b8fa3; }
      .seo-fallback h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      .seo-fallback ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .25rem 1rem; }
      .seo-fallback a { color: inherit; }
    </style>

    <!-- Cloudflare Turnstile Script for Bot Protection -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <div id="root"><!--app-fallback--></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Cloudflare Turnstile Integration (Invisible Validation) -->
    <!-- In a real deployment, the site key would be configured in Cloudflare Dashboard -->
    <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="dark" style="display:none;"></div>
  </body>
</html>
